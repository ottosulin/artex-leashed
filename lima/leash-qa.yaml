minimumLimaVersion: 2.0.0
vmType: vz
images:
  - location: "https://cloud-images.ubuntu.com/releases/stonking/release/ubuntu-26.10-server-cloudimg-arm64.img"
    arch: aarch64
cpus: 4
memory: 8GiB
disk: 40GiB
mounts:
  - location: "~"
    writable: true
mountType: virtiofs
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      curl -fsSL https://get.docker.com | sh
      systemctl enable --now docker
      usermod -aG docker {{.User}}
portForwards:
  - guestSocket: /var/run/docker.sock
    hostSocket: "{{.Dir}}/sock/docker.sock"
  - guestPort: 8787
    hostPort: 8787
  - guestPort: 8788
    hostPort: 8788
  - guestPort: 18080
    hostPort: 18080
